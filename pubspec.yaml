name: chain_activities
description: Flutter project to Chain the Activites with Timers.

publish_to: "play.google.com"
version: 1.0.0+18

environment:
  sdk: ">=3.3.3 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.1.0+1
  path: ^1.8.2
  http: ^1.3.0
  provider: ^6.0.4
  intl: ^0.20.2
  uuid: ^4.4.2
  audioplayers: ^6.5.0
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.0
  flutter_timezone: ^4.1.0
  # image_picker: ^0.8.6
  file_picker: ^10.2.0
  duration_picker: ^1.2.0
  share_plus: ^11.0.0
  receive_sharing_intent: ^1.8.1
  path_provider: ^2.1.4
  flutter_tts: ^4.0.2
  google_mobile_ads: ^6.0.0
  tutorial_coach_mark: ^1.2.11
  pixabay_picker: ^1.0.7

  firebase_core: ^4.0.0
  firebase_crashlytics: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.1
  flutter_lints: ^6.0.0

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/AppIcons/playstore.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets/AppIcons/playstore.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"
  windows:
    generate: true
    image_path: "assets/AppIcons/playstore.png"
    icon_size: 48 # min:48, max:256, default: 48

flutter:
  uses-material-design: true
  assets:
    - assets/AppIcons/playstore.png
    - assets/AppIcons/chain.png
    - assets/AppIcons/vertical_chain.png
    - assets/AppIcons/no-Image-placeholder.png
    - assets/AppIcons/pixabaylogo.png
    - assets/Sounds/chain_activity_beep.mp3
    - assets/Sounds/chain_activity_alarm.wav
    - assets/SampleChains/Sample_Diet_Routine_Chain.json
    - assets/SampleChains/Sample_Medicine_Routine_Chain.json
    - assets/SampleChains/Sample_Workout_Chain.json
    - assets/WhatIsChainAndPlay/chain_file_view.jpeg
