name: chain_activities
description: Flutter project to Chain the Activites with Timers.

publish_to: "none"
version: 1.0.0+4

environment:
  sdk: ">=3.3.3 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.1.0+1
  path: ^1.8.2

  provider: ^6.0.4
  intl: ^0.18.0
  uuid: ^3.0.6
  just_audio: ^0.9.31
  flutter_local_notifications: ^13.0.0
  timezone: ^0.9.0
  image_picker: ^0.8.6
  file_picker: ^5.3.1
  share_plus: ^7.0.2
  receive_sharing_intent: ^1.4.5
  path_provider: ^2.0.15
  flutter_tts: ^3.6.3
  google_mobile_ads: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: "^0.11.0"
  flutter_lints: ^3.0.0

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/AppIcons/playstore.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets/AppIcons/playstore.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"
  windows:
    generate: true
    image_path: "assets/AppIcons/playstore.png"
    icon_size: 48 # min:48, max:256, default: 48

flutter:
  uses-material-design: true
  assets:
    - assets/AppIcons/playstore.png
    - assets/AppIcons/chain.png
    - assets/AppIcons/vertical_chain.png
    - assets/Sounds/chain_activity_beep.mp3
    - assets/SampleChains/Sample_Diet_Routine_Chain.json
    - assets/SampleChains/Sample_Medicine_Routine_Chain.json
    - assets/SampleChains/Sample_Workout_Chain.json
    - assets/WhatIsCAT/cat_intro.png
    - assets/WhatIsCAT/go_home.png
    - assets/WhatIsCAT/individual_chain.jpeg
    - assets/WhatIsCAT/chains.jpeg
    - assets/WhatIsCAT/play_chain.jpeg
    - assets/WhatIsCAT/share_chain.jpeg
    - assets/WhatIsCAT/receive_chain.jpeg
    - assets/WhatIsCAT/upload_chain.jpeg
    - assets/WhatIsCAT/create_chain.jpeg
    - assets/WhatIsCAT/settings.jpeg
    - assets/WhatIsCAT/appdrawer.jpeg
