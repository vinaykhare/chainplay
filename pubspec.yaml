name: chain_activities
description: Flutter project to Chain the Activites with Timers.

publish_to: "play.google.com"
version: 1.0.0+13

environment:
  sdk: ">=3.3.3 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.1.0+1
  path: ^1.8.2

  provider: ^6.0.4
  intl: ^0.19.0
  uuid: ^4.4.2
  just_audio: ^0.9.31
  # flutter_local_notifications: ^17.2.1+2
  awesome_notifications_core: ^0.10.0
  awesome_notifications: any
  timezone: ^0.9.0
  flutter_timezone: ^3.0.1
  # image_picker: ^0.8.6
  file_picker: ^8.0.6
  share_plus: ^10.0.0
  receive_sharing_intent: ^1.4.5
  path_provider: ^2.1.4
  flutter_tts: ^4.0.2
  google_mobile_ads: ^5.1.0
  tutorial_coach_mark: ^1.2.11

  firebase_core: ^3.3.0
  firebase_crashlytics: ^4.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.1
  flutter_lints: ^5.0.0

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/AppIcons/playstore.png"
  min_sdk_android: 23 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets/AppIcons/playstore.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"
  windows:
    generate: true
    image_path: "assets/AppIcons/playstore.png"
    icon_size: 48 # min:48, max:256, default: 48

flutter:
  uses-material-design: true
  assets:
    - assets/AppIcons/playstore.png
    - assets/AppIcons/chain.png
    - assets/AppIcons/vertical_chain.png
    - assets/Sounds/chain_activity_beep.mp3
    - assets/Sounds/chain_activity_alarm.wav
    - assets/SampleChains/Sample_Diet_Routine_Chain.json
    - assets/SampleChains/Sample_Medicine_Routine_Chain.json
    - assets/SampleChains/Sample_Workout_Chain.json
    - assets/WhatIsCAT/chains.jpeg
    - assets/WhatIsCAT/app_drawer.jpeg
    - assets/WhatIsCAT/chain_file_view.jpeg